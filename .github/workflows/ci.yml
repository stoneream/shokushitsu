name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/tree/v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # https://github.com/actions/setup-go/tree/v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          ! gofmt -l . | tee /dev/stderr | grep -q .

      - name: Check dependencies
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o bin/shoku ./cmd/shoku
